name: 'Syntropy Axe-Core Accessibility CI'
description: 'Zero-config automated WCAG 2.1/2.2 AA accessibility audit in CI/CD with rich PR annotations and markdown summaries.'
author: 'Syntropy Digital'
branding:
  icon: 'eye'
  color: 'blue'

inputs:
  url:
    description: 'URL to scan (e.g. http://localhost:3000 or staging URL)'
    required: true
  standard:
    description: 'WCAG standard to enforce (wcag2a, wcag2aa, wcag21aa, wcag22aa)'
    required: false
    default: 'wcag21aa'
  fail-on:
    description: 'Minimum violation severity to fail the CI build (minor, moderate, serious, critical)'
    required: false
    default: 'serious'
  output-json:
    description: 'Path to save full JSON audit report'
    required: false
    default: 'axe-results.json'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Axe Core Scanner
      shell: bash
      env:
        SCAN_URL: ${{ inputs.url }}
        STANDARD: ${{ inputs.standard }}
        FAIL_ON: ${{ inputs.fail-on }}
        OUTPUT_JSON: ${{ inputs.output-json }}
      run: |
        # GitHub-hosted runners expose a ChromeDriver that matches the preinstalled Chrome via
        # $CHROMEWEBDRIVER; use it when present so the driver and browser versions cannot drift.
        DRIVER_ARGS=()
        if [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
          DRIVER_ARGS=(--chromedriver-path "$CHROMEWEBDRIVER/chromedriver")
        fi
        # axe runs a rule when it carries ANY listed tag, and WCAG levels are cumulative, so a
        # "wcag22aa" gate must include the 2.0/2.1 A and AA rule sets, not just the rules new in 2.2.
        case "$STANDARD" in
          wcag2a)   TAGS="wcag2a" ;;
          wcag2aa)  TAGS="wcag2a,wcag2aa" ;;
          wcag21a)  TAGS="wcag2a,wcag21a" ;;
          wcag21aa) TAGS="wcag2a,wcag2aa,wcag21a,wcag21aa" ;;
          wcag22a)  TAGS="wcag2a,wcag21a,wcag22a" ;;
          wcag22aa) TAGS="wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22a,wcag22aa" ;;
          *) echo "::error::unknown standard '$STANDARD' (use wcag2a, wcag2aa, wcag21aa or wcag22aa)"; exit 1 ;;
        esac
        npx --yes @axe-core/cli "$SCAN_URL" --tags "$TAGS" --save "$OUTPUT_JSON" "${DRIVER_ARGS[@]}" || true
        node "${{ github.action_path }}/dist/summary.js" "$OUTPUT_JSON" "$FAIL_ON"
